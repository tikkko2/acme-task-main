<div class="bg-white p-6 rounded shadow-md">
  <h2 class="text-xl font-bold mb-6">
    {{ editMode ? 'Edit User' : 'Add New User' }}
  </h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Name Field -->
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1"
        >Name</label
      >
      <input
        type="text"
        id="name"
        formControlName="name"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{
          'border-red-500':
            userForm.get('name')?.invalid && userForm.get('name')?.touched
        }"
        placeholder="Full Name"
      />
      <div
        *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched"
        class="text-red-500 text-sm mt-1"
      >
        Name is required
      </div>
    </div>

    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
        >Email</label
      >
      <input
        type="email"
        id="email"
        formControlName="email"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{
          'border-red-500':
            userForm.get('email')?.invalid && userForm.get('email')?.touched
        }"
        placeholder="Email Address"
      />
      <div
        *ngIf="
          userForm.get('email')?.hasError('required') &&
          userForm.get('email')?.touched
        "
        class="text-red-500 text-sm mt-1"
      >
        Email is required
      </div>
      <div
        *ngIf="
          userForm.get('email')?.hasError('email') &&
          userForm.get('email')?.touched
        "
        class="text-red-500 text-sm mt-1"
      >
        Please enter a valid email address
      </div>
    </div>

    <!-- Address Field -->
    <div>
      <label for="address" class="block text-sm font-medium text-gray-700 mb-1"
        >Address</label
      >
      <input
        type="text"
        id="address"
        formControlName="address"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Address (Optional)"
      />
    </div>

    <!-- Company Selection -->
    <div>
      <div class="flex justify-between items-center mb-1">
        <span class="block text-sm font-medium text-gray-700">Company</span>
        <button
          type="button"
          (click)="toggleNewCompany()"
          class="text-xs text-blue-600 hover:text-blue-800"
        >
          @if(!editMode) {
            {{ isNewCompany ? 'Select Existing Company' : 'Add New Company' }}
          }
        </button>
      </div>

      <!-- Existing Company Selection -->
      <div *ngIf="!isNewCompany">
        <select
          formControlName="companyId"
          (change)="onCompanyChange()"
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">-- Select Company --</option>
          <option *ngFor="let company of companies" [value]="company.id">
            {{ company.name }}
          </option>
        </select>
        <div *ngIf="companyLoading" class="mt-2 text-sm text-gray-500">
          Loading companies...
        </div>
      </div>

      <!-- Related Workers Selection -->
      <div *ngIf="editMode && potentialCoworkers.length > 0 && !isNewCompany" class="mt-4">
        <label for="worker-0" class="block text-sm font-medium text-gray-700 mb-1">Related Workers</label>
        <div class="space-y-2">
          <div *ngFor="let worker of potentialCoworkers" class="flex items-center">
            <input
              type="checkbox"
              [id]="'worker-' + worker.id"
              [checked]="userForm.get('relatedWorkers')?.value?.includes(worker.id)"
              (change)="toggleWorker(worker.id)"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            />
            <label [for]="'worker-' + worker.id" class="ml-2 block text-sm text-gray-900">
              {{ worker.name }}
            </label>
          </div>
        </div>
      </div>

      <!-- New Company Input -->
      <div *ngIf="isNewCompany && !editMode">
        <input
          type="text"
          formControlName="newCompany"
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          [ngClass]="{
            'border-red-500':
              isNewCompany &&
              userForm.get('newCompany')?.invalid &&
              userForm.get('newCompany')?.touched
          }"
          placeholder="Enter New Company Name"
        />
        <div
          *ngIf="
            isNewCompany &&
            userForm.get('newCompany')?.invalid &&
            userForm.get('newCompany')?.touched
          "
          class="text-red-500 text-sm mt-1"
        >
          Company name is required
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="text-red-500 text-sm py-2">
      {{ error }}
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-3 pt-4">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="loading"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50"
      >
        <div
          *ngIf="loading"
          class="inline-block h-4 w-4 mr-2 border-2 border-t-transparent border-white rounded-full animate-spin"
        ></div>
        <span>{{ editMode ? 'Update' : 'Save' }}</span>
      </button>
    </div>
  </form>
</div>
