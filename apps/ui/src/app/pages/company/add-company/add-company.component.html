<div class="bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-xl font-bold mb-6">
    {{ isEditMode ? 'Edit' : 'Add New' }} Company
  </h2>

  <div *ngIf="loading" class="flex justify-center my-6">
    <div
      class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"
    ></div>
  </div>

  <form
    *ngIf="!loading"
    [formGroup]="companyForm"
    (ngSubmit)="saveCompany()"
    class="space-y-4"
  >
    <!-- Name Field -->
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1"
        >Company Name</label
      >
      <input
        type="text"
        id="name"
        formControlName="name"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{
          'border-red-500':
            companyForm.get('name')?.invalid && companyForm.get('name')?.touched
        }"
        placeholder="Company Name"
      />
      <div
        *ngIf="
          companyForm.get('name')?.invalid && companyForm.get('name')?.touched
        "
        class="text-red-500 text-sm mt-1"
      >
        Company name is required
      </div>
    </div>

    <!-- Description Field -->
    <div>
      <label
        for="description"
        class="block text-sm font-medium text-gray-700 mb-1"
        >Description</label
      >
      <textarea
        id="description"
        formControlName="description"
        rows="3"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Company Description (Optional)"
      ></textarea>
    </div>

    <!-- Address Field -->
    <div>
      <label for="address" class="block text-sm font-medium text-gray-700 mb-1"
        >Address</label
      >
      <textarea
        id="address"
        formControlName="address"
        rows="2"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Company Address (Optional)"
      ></textarea>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="text-red-500 text-sm py-2">
      {{ error }}
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="submitting"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 flex items-center"
      >
        <div
          *ngIf="submitting"
          class="w-4 h-4 border-2 border-t-transparent border-white rounded-full animate-spin mr-2"
        ></div>
        <span>{{ isEditMode ? 'Update' : 'Save' }}</span>
      </button>
    </div>
  </form>
</div>
